[survey]
title = "Nix Community Survey 2025"
intro = "Welcome to this year's Nix Community Survey! Please take 5-10 minutes to fill out this survey with info about yourself and how you use projects in the Nix ecosystem. Your responses will help us develop Nix, Nixpkgs, and NixOS to better match your needs and come up with new ideas for serving and growing the community. Please note that when we only say \"Nix\" in a question, we refer to the Nix command-line tool. When we want to refer to the Nix language, Nixpkgs, NixOS, or the Nix ecosystem as a whole, we'll be clear with the terms."

