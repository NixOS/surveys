# Behaviourally anchored. The 2025 scale did not discriminate: 84.5% were
# Beginner or Intermediate while 1,555 people separately reported they can
# write their own NixOS modules. "Advanced" had no referent, so respondents
# anchored against an imagined expert. Same keys, same length, new labels.
[[groups.questions]]
id = "skillLevel"
type = "single"
choices = [
  "neverUsedNix",
  "beginner",
  "intermediate",
  "advanced",
  "preferNotToSay",
]

# Measures technical ability behaviourally, to complement skillLevel, so the
# project can see how quickly the community learns different parts of the
# ecosystem. Four items added in a single break: packaging and stdenv have no
# acquisition curve today, debugging is a capability distinct from the
# error-message comprehension item, and noneOfThese separates the 173
# respondents (5.1%) who ticked nothing from those who skipped.
#
# The order is frozen from 2026. The existing twelve keep their 2025
# positions; the packaging pair goes before contributing because packaging
# feeds contribution, debugging sits beside error messages, and the escape is
# last. Adding items in successive years would break the series repeatedly and
# destroy the cohort comparison this question exists for.
[[groups.questions]]
id = "traits"
type = "multiple"
choices = [
  "iRelyOnExamples",
  "iWriteOwnExpressions",
  "iUseModuleSystem",
  "iWriteOwnModules",
  "iUnderstandModuleDepth",
  "iHaveUsedOverlays",
  "iUnderstandOverlays",
  "iWrittenDerivation",
  "iUnderstandStdenv",
  "iComfortableContributing",
  "iTeachOthers",
  "iMakeArchitecturalChoices",
  "iReadNixSource",
  "iCanDebugBuilds",
  "iUnderstandErrorMessages",
  "noneOfThese",
]

