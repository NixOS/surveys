  "neededHelpDidNotGetIt",
  "haveNotContributed",
]

# Capped at 3; the 2025 prompt said "about 3" and enforced nothing.
# nixReferenceManual becomes documentation: documentation is the largest theme
# in the 773 write-ins at 27.6%, double the next, yet only 1.2% named the
# reference manual and 39.4% of documentation writers never ticked the
# existing option. otherNextQuestion becomes other, since the question it
# pointed at is cut; kept because 255 people chose it and it measures whether
# the list is incomplete. diskUsage is new: only 2.5% of write-ins, but with a
# displacement signature, those writers ticked Performance at 63% against a
# 37% base rate and Other at 58% against 29%.
#
# flakes is left exactly as it is. It bundles three incompatible demands (42
# write-ins want flakes stabilised, 30 redesigned first, 10 dropped), so its
# 1,708 votes are not interpretable. Recorded and deferred rather than fixed.
[[groups.questions]]
id = "improvements"
type = "multiple"
max_answers = 3
choices = [
  "performance",
  "languageUsability",
  "flakes",
  "nonExperimentalFeatures",
  "security",
  "errorMessages",
  "documentation",
  "provenanceSboms",
  "windowsSupport",
  "freebsdSupport",
  "nixAsLibrary",
  "other",
  "diskUsage",
]

