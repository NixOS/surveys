# Nix Community Survey 2026: structure. Human text lives in survey.<lang>.toml.
#
# Every question carries a comment recording the decision it supports. No
# previous year did this, which is why the 2026 redesign had to reconstruct
# 2025's intent from response counts. See
# docs/superpowers/specs/2026-09-13-community-survey-2026-design.md.

[survey]
id = 2026
language = "en"
# Grows one entry per completed translation. load_survey requires every listed
# language to cover every string AND refuses a survey.<lang>.toml whose
# language is not listed, so a file and its entry here are one change.
languages = ["en", "fr", "es-informal", "de-informal", "zh-Hans"]

[survey.privacy]
anonymized = true
save_ip_address = false
save_referrer = false
date_stamp = false
save_timings = false

[[groups]]
id = "aboutYou"

# Opens the survey: eight radio buttons. `country` held this slot in 2025 and
# would have opened the instrument with a 250-option dropdown, on the page
# where breakoff concentrates. Otherwise carried verbatim from 2025.
[[groups.questions]]
id = "age"
type = "single"
choices = [
  "under18",
  "age18to24",
  "age25to34",
  "age35to44",
  "age45to54",
  "age55to64",
  "age65plus",
  "preferNotToSay",
]

# Unchanged from 2025. The most-complained-about question in the survey (21
# objections), kept because the population share makes NASEM's critique of
# single-item gender measures bite harder here than in a general population.
[[groups.questions]]
id = "genderIdentity"
type = "single"
choices = [
  "man",
  "woman",
  "nonBinaryNonConforming",
  "identifyAnotherWay",
  "preferNotToSay",
]

# Gains `dontKnow`, reaching the minimum Stats NZ specifies for this
# construction: yes, no, don't know, prefer not to say. Placed after `no` so
# the ordered pair stays ordered and the escapes stay last.
[[groups.questions]]
id = "transgender"
type = "single"
choices = ["yes", "no", "dontKnow", "preferNotToSay"]

# 2025 offered "45 to 49 years" then "More than 50 years", so a respondent
# with exactly 50 years had no valid answer. The last band is relabelled and
# its key renamed to match; keys never reach LimeSurvey.
[[groups.questions]]
id = "yearsProgramming"
type = "single"
choices = [
  "iHaveNeverProgrammed",
  "lessThan1Year",
  "v1To4Years",
  "v5To9Years",
  "v10To14Years",
  "v15To19Years",
  "v20To24Years",
  "v25To29Years",
  "v30To34Years",
  "v35To39Years",
  "v40To44Years",
  "v45To49Years",
  "v50OrMoreYears",
  "preferNotToSay",
]

