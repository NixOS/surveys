# Seven fixes, all to the option list; the type and prompt are unchanged.
# 2025 drew 7.5% "Other" (256 people) and the research found what was in it:
# 503 Lix users with no Lix installer option, 254 Android users with no
# nix-on-droid, a factually wrong Homebrew example (there is no nix formula),
# 1,222 responses (36.0%) on an "official script" option that no longer names
# one thing now that NixOS/nix-installer is also official, and no home for
# container or CI installs. Stays `multiple`: "on any of your systems" is
# plural on purpose, and the new options exist for people who also installed
# Nix another way somewhere else.
[[groups.questions]]
id = "installMethod"
type = "multiple"
choices = [
  "preinstalledWithNixos",
  "officialInstallScript",
  "nixInstallerRust",
  "determinateInstaller",
  "lixInstaller",
  "otherPackageManager",
  "nixOnDroid",
  "containerOrCi",
  "builtFromSource",
  "other",
  "iDontUseNix",
]

# Prompt reworded to name what it is asking about; the 2025 wording carried no
# meaning outside the question that preceded it, and that context is gone.
# `fix` is a from-scratch evaluator in Zig, alpha as of September 2026. Tvix
# and Snix stay separate: Snix is a fork of Tvix announced 2025-03-16, not a
# rename. An extra option in a select-all costs almost nothing; removing one
# is a series break.
[[groups.questions]]
id = "nixImplementations"
type = "multiple"
choices = ["nix", "lix", "determinateNix", "snix", "tvix", "fix", "none"]

