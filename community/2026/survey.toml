# New for 2026, adopted near-verbatim from Stack Overflow's Employment item.
# SO gates `industry` behind it and never showed that question to 31.6% of
# their sample; we cannot branch, so this recovers the same information at
# analysis time and gives the 24.0% who are students somewhere to be counted.
[[groups.questions]]
id = "employment"
type = "single"
choices = [
  "employed",
  "selfEmployed",
  "notEmployed",
  "student",
  "retired",
  "preferNotToSay",
]

# Additions only; the existing 34 keep their 2025 positions and labels.
# `architect` took 6.1% of Stack Overflow's 2025 answers and is absent only
# because we copied their 2024 list; it goes in the alphabetical run. The
# three non-employment states go before the escapes, per the escapes-last
# principle.
[[groups.questions]]
id = "role"
type = "single"
choices = [
  "academicResearcher",
  "architect",
  "backEndDeveloper",
  "blockchainDeveloper",
  "cloudInfraEngineer",
  "dataBusinessAnalyst",
  "dataEngineer",
  "dataScientistOrMl",
  "databaseAdministrator",
  "devAiSpecialist",
  "devopsSpecialist",
  "developerExperience",
  "developerAdvocate",
  "educator",
  "embeddedAppsDeveloper",
  "enterpriseDesktopDev",
  "frontEndDeveloper",
  "fullStackDeveloper",
  "gameDeveloper",
  "hardwareEngineer",
  "manager",
  "marketingSalesPro",
  "mobileDeveloper",
  "productManager",
  "qaTestEngineer",
  "researchDevelopmentRole",
  "scientist",
  "securityProfessional",
  "seniorExecutive",
  "sreEngineer",
  "student",
  "systemNetworkAdmin",
  "uxUiDesigner",
  "selfEmployedOrFounder",
  "retired",
  "notEmployed",
  "other",
  "preferNotToSay",
]

# Rebuilt. The 2025 list's 27 options contained no software or technology
# sector, the option that takes roughly half of Stack Overflow's answers, so
# 21.0% chose Other and the non-Other answers are contaminated too. Built on
# SO's current 22-option backbone, plus four sectors this community
# over-indexes on, a non-employment escape (we cannot gate this behind
# `employment` the way SO does), and prefer-not-to-say.
[[groups.questions]]
id = "industry"
type = "single"
choices = [
  "softwareDevelopment",
  "itServices",
  "scientificResearch",
  "lifeSciences",
  "engineeringServices",
  "education",
  "government",
  "healthcare",
  "manufacturing",
  "bankingFinance",
  "fintech",
  "insurance",
  "energy",
  "utilitiesTelecom",
  "transportSupplyChain",
  "retailConsumer",
  "mediaAdvertising",
  "broadcastPublishing",
  "hospitalityTravel",
  "miningConstruction",
  "agriculture",
  "nonProfit",
  "aerospaceDefence",
  "semiconductors",
  "games",
  "cloudHosting",
  "other",
  "notEmployed",
  "preferNotToSay",
]

# Collapsed to one axis: what the software does. The 2025 list mixed four
# incompatible axes (what it does, how it is licensed, how it is delivered,
# who it serves), so its rank order was uninterpretable, not just its 15.7%
# Other rate. Five domains added: desktop, build tooling, databases, data and
# ML, scientific computing.
[[groups.questions]]
id = "domain"
type = "single"
choices = [
  "webDevelopment",
  "mobileDevelopment",
  "desktopSoftware",
  "gameDevelopment",
  "embeddedSystemsOrIot",
  "systemOsDevelopment",
  "progLangsTooling",
  "buildTooling",
  "databases",
  "dataAndMl",
  "scientificComputing",
  "cloudInfrastructure",
  "itOpsDevops",
  "infosec",
  "telecomNetworking",
  "blockchainCryptoWeb3",
  "endUserTooling",
  "other",
  "preferNotToSay",
]
