# Gains iDontLookForHelp. Highest skip rate of any closed question at 9.3%,
# and the question presupposes an activity. The vague-quantifier scale is
# left unchanged: Schaeffer establishes such scales are unsafe for absolute
# levels, but Al Baghal found them to have higher predictive validity than
# open numeric answers, and DeCastellarnau concluded no clear conclusion can
# be drawn about replacing them. The two rankings above get no escape: a
# non-qualification item a respondent must rank is incoherent, leaving it
# unranked is already the escape, and this question does the screening.
[[groups.questions]]
id = "helpSuccessFrequency"
type = "single"
choices = [
  "always",
  "often",
  "sometimes",
  "rarely",
  "never",
  "iDontLookForHelp",
]

[[groups]]
id = "contributing"

# Replaces contribExperience, which conflated three constructs in one
# select-all: a respondent who tried, got stuck, then succeeded with help
# ticked three options meaning different things, so the percentages could not
# be read as a funnel. This gives the denominator.
[[groups.questions]]
id = "contribStatus"
type = "single"
choices = [
  "contributedMerged",
  "contributedNotMerged",
  "triedNotCompleted",
  "notTried",
