# Restructured. Three defects in 2025: the stem was conditional, so it
# screened nobody; five options formed a severity ladder and two did not,
# violating the rule that every option in an ordered set is a point on the
# same continuum; and there was no "I don't run NixOS stable" option, so
# unstable-only users landed in "I have not upgraded" (434) or skipped (602),
# conflating two states that mean opposite things to a release manager.
#
# The five severity labels and the two existing escapes keep their 2025
# wording CHARACTER FOR CHARACTER, trailing full stops included.
# aggregate.sankey_funnel matches all seven literally; rewording any of them
# makes that lookup return zero, drops the link below the suppression floor,
# and renders the funnel chart blank with no error raised.
#
# This question hardcodes a release number and must be re-authored every year.
[[groups.questions]]
id = "stableUpgrade"
type = "single"
choices = [
  "severeCouldNotUpgrade",
  "severeFiguredOut",
  "iHadModerateIssues",
  "iHadMinorIssues",
  "iHadNoIssues",
  "iHaveNotUpgraded",
  "iDidNotKnow",
  "iDontRunStable",
  "iDontUseNixos",
]

[[groups]]
id = "adoption"

# The single headline adoption measure, and the one question whose meaning
# turns entirely on what "Nix" refers to, so the prompt now names the package
# manager. Choices unchanged. In 2025 this led into personalHoldsBack, which
# is cut; it now leads into the two barriers questions in the same group.
[[groups.questions]]
id = "regularToolset"
type = "single"
choices = ["yes", "no"]

# New. Restores the topic six free-text questions covered in 2025, none of
# which was ever analysed. Two questions rather than one because classifying
# all 2,642 answers found the personal and workplace stems measure different
# constructs: documentation is 3.7% of workplace answers and 30.4% of
# personal-use answers, an eightfold gap, so merging them returns a blend
# determined by the stem wording and comparable to neither.
#
# Options come from the classification, not from priors. Four that looked
# obvious failed against the data and are absent: error messages ranked 22nd
# of 23 themes; "editor and tooling support" was far narrower than the
# integration complaints people actually made; a single "does not support a
# platform I need" caught only 111 of 290 platform answers because 184
# describe an environment committed to another platform, a different claim;
# and awareness was wrongly folded into "hard to convince".
#
# Order is thematic and then frozen. Ordering by observed frequency would be
# self-reinforcing in later years.
[[groups.questions]]
id = "barriersPersonal"
type = "multiple"
choices = [
  "learningCurve",
  "nixLanguage",
  "documentation",
  "installSetup",
  "packagingOwn",
  "missingPackages",
  "foreignBinaries",
  "platformSupport",
  "buildCost",
  "keepingUp",
  "noTime",
