# The survey's only free-text question, retained after an earlier draft cut it
# on misread evidence. 20 respondents asked for MORE free text; the 15 who
# complained about textareas were objecting to the workplace block, closed
# yes/no questions wrongly rendered as textareas, and there is zero overlap
# between the two groups. More decisively, the per-question complaint tally
# this question produced reshaped four decisions in the 2026 design, and that
# information is not obtainable any other way.
[[groups.questions]]
id = "surveyFeedback"
type = "text"
