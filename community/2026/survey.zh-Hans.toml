# Nix 社区调查 2026：简体中文。使用「你」而非「您」。
# 参见 community/TRANSLATING.md。

[survey]
title = "Nix 社区调查 2026"
intro = "<p>欢迎参加今年的 Nix 社区调查，填写大约需要 10 到 15 分钟。</p><p>你的回答能帮助 Nix 各团队和 NixOS Foundation 决定该把精力投向哪里：需要支持哪些平台、文档在哪些地方帮不上忙，以及是什么让大家没有更多地使用 Nix。结果会以汇总形式发布在 survey.nixos.org 上，往年的结果也在那里。</p><p>本调查匿名进行。我们不会询问你的姓名或电子邮箱，不记录你的 IP 地址，也不保存时间戳。关于你本人的问题，例如年龄、国家和工作，是为了判断我们听到的是整个社区的声音，还是只有其中一部分。所有问题都可以跳过。</p>"

