# Golden fixture for the LimeSurvey emitter (see expected_survey.txt).
# Covers all six type letters, other, max_answers, soft mandatory, a group
# description, help text, an end text, and two languages.
[survey]
id = 424242
language = "en"
languages = ["en", "de"]

[survey.privacy]
anonymized = true
save_ip_address = false
save_referrer = false
date_stamp = false
save_timings = false

[[groups]]
id = "aboutYou"

[[groups.questions]]
id = "country"
type = "single"
choices = ["europe", "asia"]

[[groups.questions]]
id = "age"
type = "single"
display = "dropdown"
mandatory = "on"
choices = ["young", "old"]

[[groups]]
id = "usage"

[[groups.questions]]
id = "os"
type = "multiple"
other = true
mandatory = "soft"
choices = ["linux", "macos", "windows"]

[[groups.questions]]
id = "priorities"
type = "ranking"
max_answers = 2
choices = ["perf", "security", "docs"]

[[groups.questions]]
id = "nixVersion"
type = "text"
size = "short"

[[groups.questions]]
id = "feedback"
type = "text"

# A group gated on an earlier question, containing a question with its own
# (narrower) gate: exercises group relevance, question relevance, and their
# combination in the emitter.
[[groups]]
id = "followup"
condition = { question = "country", includes = ["europe", "asia"] }

[[groups.questions]]
id = "moveReason"
type = "single"
choices = ["work", "study"]
condition = { question = "country", includes = ["europe"] }

[[groups.questions]]
id = "moveDetail"
type = "text"
